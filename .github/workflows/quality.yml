name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Count Vercel Functions
        shell: bash
        run: |
          function_count="$(
            find api \
              -type f \
              -name "*.js" \
              ! -path "api/_lib/*" |
              wc -l |
              tr -d " "
          )"

          echo "Vercel Function count: ${function_count}"

          if [ "${function_count}" -gt 12 ]; then
            echo "The Vercel Hobby limit of 12 Functions was exceeded."
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Run validation harnesses
        run: npm run check:validation

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Run browser and accessibility tests
        run: npm run test:e2e

      - name: Audit production dependencies
        run: npm audit --omit=dev